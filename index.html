<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double+Ink:wght@100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerd&Geek Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Nerd&Geek Hub</h1>
    
    <div class="container-login">
        <form id='formLogin'>
            <label for="user">Usuário:</label>
            <input type="text" id="userLogin" placeholder="Usuário" required>

            <label for="password">Senha:</label>
            <input type="password" id="passwordLogin" placeholder="Senha" required>

            <button type="submit">Entrar</button>

        </form>

        <p id="errorLoginMessage" style="color:red"></p>
    </div>
    
    <div id="resultados"></div>
    <script src="script.js"></script>
</body>
</html>
